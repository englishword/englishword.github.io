{% assign current_lang = page.lang | default: site.default_lang %}
<div class="language-switcher">
  <select id="language-select" onchange="switchLanguage(this.value)" aria-label="Language">
    {% for l in site.data.languages %}
    <option value="{{ l.url_prefix }}" {% if l.code == current_lang %}selected{% endif %}>{{ l.name }}</option>
    {% endfor %}
  </select>
</div>
<script>
function switchLanguage(prefix) {
  var path = window.location.pathname.replace(/\/+$/, '');
  // strip existing language prefix (/zh, /ko, /ja)
  path = path.replace(/^\/(zh|ko|ja)(?=\/|$)/, '');
  if (path === '') path = '/';
  if (prefix) { path = prefix + path; }
  if (!path.endsWith('/')) path = path + '/';
  window.location.href = path;
}
</script>
