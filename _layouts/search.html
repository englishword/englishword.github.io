---
layout: default
bodyClass: "page-search"
---

<div class="container pb-6 pt-6 pt-md-10 pb-md-10">
  <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
      <h1 class="title">{{ page.title }}</h1>
      <div class="content">{{ content }}</div>
      <div class="word-search">
        <input type="text" id="word-search-input" placeholder="{{ page.search_placeholder | default: 'Search...' }}" autocomplete="off">
        <div id="word-search-count" class="word-search-count"></div>
        <div id="word-search-results" class="word-search-results"></div>
      </div>
    </div>
  </div>
</div>
{% assign words_json = '/assets/data/words.json' %}
{% if page.lang == 'zh' %}{% assign words_json = '/assets/data/words_zh.json' %}{% endif %}
<script>window.WORDS_URL = "{{ words_json | relative_url }}";</script>
<script src="{{ '/assets/js/search.js' | relative_url }}"></script>
