<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 120" role="img" aria-labelledby="t2 d2">
  <title id="t2">汉字编码方式</title>
  <desc id="d2">流程图：笔画 → 偏旁部首等 → 汉字 → 汉语词汇。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#1a1a1a" text-rendering="geometricPrecision">
    <g stroke="#1a1a1a" stroke-width="1.6" fill="none">
      <line x1="180" y1="60" x2="230" y2="60" marker-end="url(#arrow)"/>
      <line x1="350" y1="60" x2="400" y2="60" marker-end="url(#arrow)"/>
      <line x1="490" y1="60" x2="540" y2="60" marker-end="url(#arrow)"/>
    </g>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2">
      <rect x="30" y="28" width="150" height="64"/>
      <rect x="230" y="28" width="120" height="64"/>
      <rect x="400" y="28" width="90" height="64"/>
      <rect x="540" y="28" width="120" height="64"/>
    </g>
    <g text-anchor="middle" dominant-baseline="central">
      <text x="105" y="50">笔画：</text>
      <text x="105" y="74">横竖撇捺折</text>
      <text x="290" y="50">偏旁</text>
      <text x="290" y="74">部首等</text>
      <text x="445" y="60">汉字</text>
      <text x="600" y="50">汉语</text>
      <text x="600" y="74">词汇</text>
    </g>
  </g>
</svg>
