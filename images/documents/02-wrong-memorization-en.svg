<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-labelledby="t1 d1">
  <title id="t1">The Common but Wrong Way to Memorize</title>
  <desc id="d1">Flowchart: a student forcibly links letters, pronunciation, translated meaning, and part of speech onto the English word.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#1a1a1a" text-rendering="geometricPrecision">
    <!-- 连线（先画，置于方框下层） -->
    <g stroke="#1a1a1a" stroke-width="1.6" fill="none">
      <line x1="110" y1="270" x2="200" y2="270" marker-end="url(#arrow)"/>
      <line x1="250" y1="100" x2="250" y2="240" marker-end="url(#arrow)"/>
      <line x1="420" y1="100" x2="420" y2="240" marker-end="url(#arrow)"/>
      <line x1="590" y1="100" x2="590" y2="240" marker-end="url(#arrow)"/>
    </g>
    <!-- 方框 -->
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2">
      <rect x="200" y="240" width="440" height="60"/>
      <rect x="20" y="240" width="90" height="60"/>
      <rect x="215" y="40" width="70" height="60"/>
      <rect x="355" y="40" width="130" height="60"/>
      <rect x="555" y="40" width="70" height="60"/>
    </g>
    <!-- 文字 -->
    <g text-anchor="middle" dominant-baseline="central">
      <text x="420" y="270">English word</text>
      <text x="65" y="270">Letters</text>
      <text x="250" y="70">Sound</text>
      <text x="420" y="70">Chinese meaning</text>
      <text x="590" y="62">Part of<tspan x="590" dy="18">speech</tspan></text>
    </g>
  </g>
</svg>
