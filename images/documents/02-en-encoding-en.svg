<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 120" role="img" aria-labelledby="t3 d3">
  <title id="t3">English Encoding</title>
  <desc id="d3">Flowchart: Letters → Phonemes → Morphemes → English vocabulary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#1a1a1a" text-rendering="geometricPrecision">
    <g stroke="#1a1a1a" stroke-width="1.6" fill="none">
      <line x1="140" y1="60" x2="190" y2="60" marker-end="url(#arrow)"/>
      <line x1="300" y1="60" x2="350" y2="60" marker-end="url(#arrow)"/>
      <line x1="460" y1="60" x2="510" y2="60" marker-end="url(#arrow)"/>
    </g>
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2">
      <rect x="30" y="28" width="110" height="64"/>
      <rect x="190" y="28" width="110" height="64"/>
      <rect x="350" y="28" width="110" height="64"/>
      <rect x="510" y="28" width="110" height="64"/>
    </g>
    <g text-anchor="middle" dominant-baseline="central">
      <text x="85" y="60">Letters</text>
      <text x="245" y="60">Phonemes</text>
      <text x="405" y="60">Morphemes</text>
      <text x="565" y="50">English</text>
      <text x="565" y="74">vocabulary</text>
    </g>
  </g>
</svg>
