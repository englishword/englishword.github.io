<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <title>IPSM Approach</title>
  <defs>
    <radialGradient id="aura" cx="50%" cy="56%" r="62%">
      <stop offset="0%" stop-color="#2E8BFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#12489E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 不透明黑色圆角底 -->
  <rect width="32" height="32" rx="7" fill="#06070C"/>
  <!-- 蓝色径向辉光（黑石后方的能量场） -->
  <rect width="32" height="32" rx="7" fill="url(#aura)"/>
  <!-- 黑石三角：深黑面 + 冷蓝辉光边 -->
  <g filter="url(#glow)">
    <polygon points="16,6 25.6,22.6 6.4,22.6"
             fill="#05070E" stroke="#5AA8FF"
             stroke-width="1.6" stroke-linejoin="round"/>
  </g>
</svg>
